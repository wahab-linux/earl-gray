name: Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Install LibreOffice for real slide conversion tests
        shell: pwsh
        run: |
          choco install libreoffice-fresh --yes --no-progress --limit-output
          if ($LASTEXITCODE -eq 3010) { $global:LASTEXITCODE = 0 }
      - name: Test Windows imports, progress, scrolling, and PDF sections
        env:
          EARLGRAY_REQUIRE_INTEGRATION_TESTS: "1"
        run: python -m unittest discover -s tests -v
      - name: Package Windows app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all pypdfium2 --collect-all customtkinter --hidden-import PIL._tkinter_finder --add-data assets:assets --icon assets/earl-gray.ico --name EarlGray app.py
      - name: Verify the packaged app opens and closes
        run: python scripts/check_windows_build.py dist/EarlGray.exe
      - uses: actions/upload-artifact@v4
        with:
          name: EarlGray-Windows
          path: dist/EarlGray.exe
          if-no-files-found: error
